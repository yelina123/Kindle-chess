<style>

/* ---------- 基础 ---------- */
html, body { margin: 0; padding: 0; }
body {
  background: #ffffff; color: #000000;
  font-family: Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Heiti SC", sans-serif;
  font-size: 15px; line-height: 1.4;
  -webkit-text-size-adjust: none;
}
img { border: 0; }
button {
  font-family: Helvetica, Arial, "PingFang SC", "Heiti SC", sans-serif;
  color: #000; background: #fff;
  border: 1px solid #000; border-radius: 0;
  padding: 0; margin: 0;
  cursor: pointer;
}
.clr { clear: both; height: 0; line-height: 0; font-size: 0; }

#app { width: 568px; margin: 0 auto; padding: 10px 0 16px 0; }

/* ---------- 页头 ---------- */
#hdr { height: 44px; border-bottom: 2px solid #000; margin-bottom: 10px; position: relative; }
#logo { position: absolute; left: 0; top: 3px; width: 32px; height: 32px; }
#hdr h1 {
  margin: 0 0 0 40px;
  font: normal 27px/34px Georgia, "Songti SC", "Times New Roman", serif;
  letter-spacing: 2px;
}
#hdrSub {
  position: absolute; right: 0; top: 7px;
  font-size: 10px; line-height: 14px; text-align: right;
}

/* ---------- 对局视图 ---------- */
#mainRow { height: 468px; }
#boardSide { float: left; width: 466px; height: 468px; position: relative; }
#rankLabels { position: absolute; left: 0; top: 2px; width: 14px; height: 448px; }
#board { position: absolute; left: 14px; top: 0; width: 448px; height: 448px; border: 2px solid #000; }
#fileLabels { position: absolute; left: 16px; top: 454px; width: 448px; height: 14px; }

.cell { position: absolute; width: 56px; height: 56px; overflow: hidden; }
.cell img { position: absolute; left: 3px; top: 3px; width: 50px; height: 50px; }
.mark { position: absolute; left: 0; top: 0; width: 56px; height: 56px; }
.mk-sel   { left: 0; top: 0; width: 48px; height: 48px; border: 4px solid #000; }
.mk-check { left: 0; top: 46px; width: 56px; height: 10px; background: #000; }
.mk-last  { left: 1px; top: 1px; width: 50px; height: 50px; border: 2px dotted #000; }
.mk-dot   { left: 23px; top: 23px; width: 10px; height: 10px; background: #000; }
.mk-ring  { left: 18px; top: 18px; width: 16px; height: 16px; border: 3px solid #000; }
.mk-hint  { left: 2px; top: 2px; width: 48px; height: 48px; border: 3px dashed #000; }
.clab { position: absolute; left: 0; width: 14px; height: 56px; line-height: 56px; text-align: center; font-size: 9px; }
.flab { position: absolute; top: 0; width: 56px; height: 14px; line-height: 14px; text-align: center; font-size: 9px; }

#panelSide { float: left; width: 96px; margin-left: 6px; }

.clock { border: 1px solid #000; height: 58px; margin-bottom: 8px; }
.clabel {
  height: 17px; line-height: 17px; padding-left: 5px;
  background: #000; color: #fff; font-size: 10px;
}
.ctime {
  height: 41px; line-height: 41px; text-align: center;
  font: bold 27px "Courier New", Courier, monospace;
}
.clock.on .ctime { background: #000; color: #fff; }

#statusBox { border-top: 1px solid #000; padding-top: 0; }
#modeText {
  height: 20px; line-height: 20px; margin-bottom: 3px;
  background: #000; color: #fff; font-size: 9px; text-align: center;
}
#turnText { font-size: 14px; font-weight: bold; line-height: 18px; }
#metaText { font-size: 10px; line-height: 13px; }
#noteText { font-size: 10px; line-height: 13px; height: 13px; font-weight: bold; }
#btnPause { width: 94px; height: 40px; font-size: 11px; margin-top: 3px; }

#movesHead { font-size: 10px; line-height: 15px; border-bottom: 1px solid #000; margin-top: 8px; }
#movesBox { height: 140px; overflow: hidden; font: 12px/16px Georgia, "Songti SC", serif; padding-top: 2px; }
#hintBox { margin-top: 10px; border-top: 1px solid #000; padding-top: 3px; font-size: 9px; line-height: 12px; }

/* ---------- 按钮 ---------- */
.btn {
  display: block; float: left;
  height: 42px; line-height: 42px;
  font-size: 15px; text-align: center;
  background: #fff; color: #000;
}
.btn:active { background: #000; color: #fff; }
.btn[disabled] { color: #999; border-color: #999; }
.btn.w135 { width: 135px; margin: 0 5px 6px 0; }
#bTime { margin-right: 0; }
#bSet { margin-right: 0; }
.btn.w182 { width: 182px; margin: 0 8px 6px 0; }
.btn.w90  { width: 90px;  margin: 0 8px 0 0; }
.btn.w120 { width: 120px; margin: 0 8px 0 0; }
.btn.w180 { width: 180px; margin: 0 8px 0 0; }
.trow { height: 48px; }

#toolbar { clear: both; padding-top: 10px; height: 100px; }
#actionPanel { clear: both; padding-top: 10px; min-height: 100px; }

/* ---------- 面板 ---------- */
.panel { border-top: 2px solid #000; padding-top: 7px; }
.ptitle { font-size: 13px; font-weight: bold; line-height: 40px; height: 40px; margin-bottom: 4px; }
.ptitle .pclose { float: right; width: 72px; height: 38px; line-height: 38px; font-size: 10px; font-weight: normal; }
.ptext { font-size: 12px; line-height: 17px; }
.prow { height: 50px; }
.pbtn {
  float: left; width: 72px; height: 54px; margin-right: 8px;
  border: 1px solid #000; background: #fff;
}
.pbtn img { width: 34px; height: 34px; display: block; margin: 2px auto 0 auto; }
.pbtn span { display: block; font-size: 9px; line-height: 12px; text-align: center; }
.pbtn.wide { width: 160px; }
.pbtn:active { background: #000; }

.anRow { font-size: 12px; line-height: 18px; }
.anScore { font: bold 24px/28px Georgia, serif; float: left; width: 96px; }
.anBest { float: left; width: 460px; font-size: 12px; line-height: 18px; }
.anStats { font-size: 10px; line-height: 14px; }
.anTitle { line-height: 18px; }
.anTitle .ptMain { display: block; font-size: 13px; line-height: 18px; }
.anTitle .ptSub { display: block; font-size: 9px; line-height: 11px; font-weight: normal; }
.wrBox { margin: 4px 0 2px 0; }
.wrLabels { font-size: 10px; line-height: 12px; }
.wrLabels .wrR { float: right; }
.wrBar { height: 12px; border: 1px solid #000; background: #fff; position: relative; margin-top: 2px; }
.wrFill { position: absolute; right: 0; top: 0; height: 10px; background: #000; }

/* ---------- 编辑器 ---------- */
#editBoardSide { float: left; width: 466px; height: 468px; position: relative; }
#editBoard { position: absolute; left: 14px; top: 0; width: 448px; height: 448px; border: 2px solid #000; }
#erankLabels { position: absolute; left: 0; top: 2px; width: 14px; height: 448px; }
#efileLabels { position: absolute; left: 16px; top: 454px; width: 448px; height: 14px; }
#palette { float: left; width: 96px; margin-left: 6px; }
.pal {
  float: left; width: 38px; height: 38px;
  border: 3px solid #fff; background: #fff; padding: 0;
  margin: 0 2px 4px 0;
}
.pal img { width: 28px; height: 28px; display: block; margin: 2px auto 0 auto; }
.pal.sel { border-color: #000; }
.pal.erase { font-size: 14px; line-height: 32px; text-align: center; }

#editCtrl { clear: both; padding-top: 8px; }
.miniLabel { float: left; width: 34px; font-size: 10px; line-height: 42px; }
.tbtn {
  float: left; height: 42px; min-width: 38px; padding: 0 4px;
  font-size: 13px; margin-right: 6px;
}
.tbtn.on { background: #000; color: #fff; }
#fenInput {
  float: left; width: 350px; height: 36px; line-height: 36px;
  font-size: 16px; padding: 0 4px; border: 1px solid #000;
  background: #fff; color: #000;
}
#edMsg { font-size: 11px; line-height: 15px; min-height: 15px; }
#edRow3 { height: 48px; }

.vhead { height: 40px; border-bottom: 2px solid #000; margin-bottom: 8px; }
.vtitle { float: left; font: 20px/32px Georgia, "Songti SC", serif; }
.vback { float: right; width: 96px; height: 34px; line-height: 34px; font-size: 11px; }

/* ---------- 对弈模式 ---------- */
.modeCards { padding-top: 2px; }
.modeCard {
  display: block; float: left; width: 272px; height: 68px;
  padding: 0; border: 2px solid #000; background: #fff; color: #000;
  text-align: left;
}
.modeCard.on { background: #000; color: #fff; }
.modeCard .mcTitle {
  display: block; padding: 9px 10px 0 10px;
  font: bold 18px/24px Georgia, "Songti SC", serif;
}
.modeCard .mcDesc { display: block; padding: 2px 10px 0 10px; font-size: 11px; line-height: 15px; }
#modeHuman { margin-right: 8px; }
#modeCpu { margin-right: 0; }
#modeCpuOpts { display: none; }
.mrow { height: 50px; margin-top: 8px; }
.mlabel { float: left; width: 78px; font-size: 12px; line-height: 44px; }
.mbtn {
  float: left; width: 90px; height: 44px; line-height: 44px;
  font-size: 13px; margin-right: 5px; border: 1px solid #000;
}
.mbtn.on { background: #000; color: #fff; }
#ml4 { margin-right: 0; }
#modeStart {
  width: 298px; height: 44px; line-height: 44px; margin-top: 10px;
}
.mnote { font-size: 10px; line-height: 14px; margin-top: 4px; }
#modeMsg { font-size: 11px; line-height: 15px; min-height: 15px; margin-top: 4px; }

/* ---------- 设置 ---------- */
.sect { border-top: 1px solid #000; padding: 6px 0 4px 0; }
.sectTitle { font-size: 12px; font-weight: bold; line-height: 16px; margin-bottom: 6px; }
.gbtn {
  float: left; width: 128px; height: 42px; line-height: 42px;
  font-size: 14px; margin: 0 6px 6px 0;
}
.gbtn.on { background: #000; color: #fff; }
.stepLabel { float: left; width: 86px; font-size: 12px; line-height: 42px; }
.stepBtn { float: left; width: 42px; height: 42px; font-size: 14px; margin-right: 6px; }
.stepVal { float: left; width: 66px; height: 42px; line-height: 42px; font: bold 20px Georgia, serif; text-align: center; }
.stepUnit { float: left; width: 36px; font-size: 11px; line-height: 42px; }
.note { font-size: 10px; line-height: 14px; }
.segRow { height: 46px; }
.segLabel { float: left; width: 96px; font-size: 12px; line-height: 42px; }
.segBtn { float: left; height: 42px; min-width: 54px; padding: 0 8px; font-size: 13px; margin-right: 6px; }
.segBtn.on { background: #000; color: #fff; }

.helpText { font-size: 11px; line-height: 16px; margin-top: 4px; }
.helpText b { font-weight: bold; }


</style>
</head>
<body>

<script>

/* ============================================================
   国际象棋核心：0x88 棋盘、走法生成、SAN、FEN、简易搜索引擎
   兼容 ES3/ES5（Kindle 第八代 WebKit 531）
   ============================================================ */
var EMPTY = 0, PAWN = 1, KNIGHT = 2, BISHOP = 3, ROOK = 4, QUEEN = 5, KING = 6;
var MATE = 100000;
var INF  = 1000000;

var KNIGHT_OFF = [33, 31, 18, 14, -14, -18, -31, -33];
var BISHOP_OFF = [17, 15, -15, -17];
var ROOK_OFF   = [16, -16, 1, -1];
var KING_OFF   = [16, -16, 1, -1, 17, 15, -15, -17];

function typeOf(p) { return p & 7; }
function isBlackPiece(p) { return p >= 8; }

/* ---------- 初始局面 / FEN ---------- */
function newPosition() {
  var b = [], i;
  for (i = 0; i < 128; i++) b[i] = 0;
  var back = [ROOK, KNIGHT, BISHOP, QUEEN, KING, BISHOP, KNIGHT, ROOK];
  for (i = 0; i < 8; i++) {
    b[i]        = back[i];
    b[112 + i]  = back[i] | 8;
    b[16 + i]   = PAWN;
    b[96 + i]   = PAWN | 8;
  }
  return {
    board: b, side: 0, castling: 15, ep: -1, half: 0, full: 1,
    king: [4, 116]
  };
}

function clonePosition(pos) {
  var b = [], i;
  for (i = 0; i < 128; i++) b[i] = pos.board[i];
  return {
    board: b, side: pos.side, castling: pos.castling, ep: pos.ep,
    half: pos.half, full: pos.full,
    king: [pos.king[0], pos.king[1]]
  };
}

function sqOfName(s) {
  if (!s || s.length < 2) return -1;
  var f = s.charCodeAt(0) - 97, r = s.charCodeAt(1) - 49;
  if (f < 0 || f > 7 || r < 0 || r > 7) return -1;
  return r * 16 + f;
}

function parseFen(fen) {
  if (!fen) return null;
  var parts = fen.split(' ');
  if (parts.length < 4) return null;
  var b = [], i;
  for (i = 0; i < 128; i++) b[i] = 0;
  var rows = parts[0].split('/');
  if (rows.length !== 8) return null;
  var rank, file, ch, p, code;
  for (i = 0; i < 8; i++) {
    rank = 7 - i; file = 0;
    var row = rows[i];
    for (var j = 0; j < row.length; j++) {
      ch = row.charAt(j);
      if (ch >= '1' && ch <= '8') { file += parseInt(ch, 10); }
      else {
        code = 0;
        if (ch === 'P') code = PAWN;
        else if (ch === 'N') code = KNIGHT;
        else if (ch === 'B') code = BISHOP;
        else if (ch === 'R') code = ROOK;
        else if (ch === 'Q') code = QUEEN;
        else if (ch === 'K') code = KING;
        else if (ch === 'p') code = PAWN | 8;
        else if (ch === 'n') code = KNIGHT | 8;
        else if (ch === 'b') code = BISHOP | 8;
        else if (ch === 'r') code = ROOK | 8;
        else if (ch === 'q') code = QUEEN | 8;
        else if (ch === 'k') code = KING | 8;
        else return null;
        if (file > 7) return null;
        b[rank * 16 + file] = code;
        file++;
      }
    }
    if (file !== 8) return null;
  }
  var side = parts[1] === 'b' ? 1 : 0;
  var castling = 0;
  if (parts[2].indexOf('K') >= 0) castling |= 1;
  if (parts[2].indexOf('Q') >= 0) castling |= 2;
  if (parts[2].indexOf('k') >= 0) castling |= 4;
  if (parts[2].indexOf('q') >= 0) castling |= 8;
  var ep = parts[3] === '-' ? -1 : sqOfName(parts[3]);
  var half = parts.length > 4 ? parseInt(parts[4], 10) : 0;
  var full = parts.length > 5 ? parseInt(parts[5], 10) : 1;
  if (isNaN(half)) half = 0;
  if (isNaN(full) || full < 1) full = 1;

  var kw = -1, kb = -1;
  for (i = 0; i < 128; i++) {
    if (i & 0x88) continue;
    if (b[i] === KING) kw = i;
    if (b[i] === (KING | 8)) kb = i;
  }
  if (kw < 0 || kb < 0) return null;
  var pos = { board: b, side: side, castling: castling, ep: ep, half: half, full: full, king: [kw, kb] };
  if (!epOk(pos)) pos.ep = -1;
  fixCastling(pos);
  return pos;
}

function fixCastling(pos) {
  var b = pos.board, c = pos.castling;
  if (b[4] !== KING || b[7] !== ROOK) c &= ~1;
  if (b[4] !== KING || b[0] !== ROOK) c &= ~2;
  if (b[116] !== (KING | 8) || b[119] !== (ROOK | 8)) c &= ~4;
  if (b[116] !== (KING | 8) || b[112] !== (ROOK | 8)) c &= ~8;
  pos.castling = c;
}

function epOk(pos) {
  if (pos.ep < 0) return false;
  var b = pos.board, f = pos.ep & 7;
  var r = pos.ep >> 4;
  var pawnSq = pos.side === 0 ? pos.ep - 16 : pos.ep + 16;
  if (pawnSq < 0 || pawnSq > 127 || (pawnSq & 0x88)) return false;
  var want = pos.side === 0 ? (PAWN | 8) : PAWN;
  if (b[pawnSq] !== want) return false;
  var fromRank = pos.side === 0 ? 5 : 2;
  if (r !== fromRank) return false;
  if (b[pos.ep] !== 0) return false;
  return true;
}

function toFen(pos) {
  var b = pos.board, out = '', rank, file, empty, p;
  for (rank = 7; rank >= 0; rank--) {
    empty = 0;
    for (file = 0; file < 8; file++) {
      p = b[rank * 16 + file];
      if (!p) { empty++; }
      else {
        if (empty) { out += empty; empty = 0; }
        out += fenChar(p);
      }
    }
    if (empty) out += empty;
    if (rank > 0) out += '/';
  }
  out += pos.side === 0 ? ' w ' : ' b ';
  var c = '';
  if (pos.castling & 1) c += 'K';
  if (pos.castling & 2) c += 'Q';
  if (pos.castling & 4) c += 'k';
  if (pos.castling & 8) c += 'q';
  out += (c || '-') + ' ';
  out += (pos.ep >= 0 ? nameOfSq(pos.ep) : '-') + ' ';
  out += pos.half + ' ' + pos.full;
  return out;
}

function fenChar(p) {
  var t = typeOf(p);
  var c = 'P';
  if (t === KNIGHT) c = 'N';
  else if (t === BISHOP) c = 'B';
  else if (t === ROOK) c = 'R';
  else if (t === QUEEN) c = 'Q';
  else if (t === KING) c = 'K';
  return isBlackPiece(p) ? c.toLowerCase() : c;
}

function nameOfSq(sq) {
  return String.fromCharCode(97 + (sq & 7)) + String.fromCharCode(49 + (sq >> 4));
}

/* ---------- 攻击判定 ---------- */
function isAttacked(pos, sq, by) {
  var b = pos.board, i, s, p;
  /* 兵 */
  if (by === 0) {
    s = sq - 17; if (!(s & 0x88) && b[s] === PAWN) return true;
    s = sq - 15; if (!(s & 0x88) && b[s] === PAWN) return true;
  } else {
    s = sq + 17; if (!(s & 0x88) && b[s] === (PAWN | 8)) return true;
    s = sq + 15; if (!(s & 0x88) && b[s] === (PAWN | 8)) return true;
  }
  /* 马 */
  for (i = 0; i < 8; i++) {
    s = sq + KNIGHT_OFF[i];
    if (!(s & 0x88)) {
      p = b[s];
      if (p && typeOf(p) === KNIGHT && (isBlackPiece(p) ? 1 : 0) === by) return true;
    }
  }
  /* 王 */
  for (i = 0; i < 8; i++) {
    s = sq + KING_OFF[i];
    if (!(s & 0x88)) {
      p = b[s];
      if (p && typeOf(p) === KING && (isBlackPiece(p) ? 1 : 0) === by) return true;
    }
  }
  /* 象/后 */
  for (i = 0; i < 4; i++) {
    s = sq + BISHOP_OFF[i];
    while (!(s & 0x88)) {
      p = b[s];
      if (p) {
        if ((isBlackPiece(p) ? 1 : 0) === by && (typeOf(p) === BISHOP || typeOf(p) === QUEEN)) return true;
        break;
      }
      s += BISHOP_OFF[i];
    }
  }
  /* 车/后 */
  for (i = 0; i < 4; i++) {
    s = sq + ROOK_OFF[i];
    while (!(s & 0x88)) {
      p = b[s];
      if (p) {
        if ((isBlackPiece(p) ? 1 : 0) === by && (typeOf(p) === ROOK || typeOf(p) === QUEEN)) return true;
        break;
      }
      s += ROOK_OFF[i];
    }
  }
  return false;
}

function inCheck(pos, color) {
  var ks = pos.king[color];
  if (ks < 0) return false;
  return isAttacked(pos, ks, 1 - color);
}

/* ---------- 走法生成 ---------- */
function mk(f, t, cap, flag, promo) {
  return { f: f, t: t, cap: cap, flag: flag || 0, p: promo || 0 };
}

function pushPawnMove(list, f, t, cap, flag, promoRank) {
  if ((t >> 4) === promoRank) {
    list.push(mk(f, t, cap, flag, QUEEN));
    list.push(mk(f, t, cap, flag, ROOK));
    list.push(mk(f, t, cap, flag, BISHOP));
    list.push(mk(f, t, cap, flag, KNIGHT));
  } else {
    list.push(mk(f, t, cap, flag, 0));
  }
}

function genMoves(pos, capturesOnly) {
  var b = pos.board, list = [], side = pos.side, i, sq, p, t, s, d, j;
  var forward = side === 0 ? 16 : -16;
  var startRank = side === 0 ? 1 : 6;
  var promoRank = side === 0 ? 7 : 0;
  var enemyBit = side === 0 ? 8 : 0;

  for (sq = 0; sq < 128; sq++) {
    if (sq & 0x88) continue;
    p = b[sq];
    if (!p) continue;
    if ((p >= 8 ? 1 : 0) !== side) continue;

    var ty = typeOf(p);

    if (ty === PAWN) {
      t = sq + forward;
      if (!(t & 0x88) && !b[t] && !capturesOnly) {
        pushPawnMove(list, sq, t, 0, 0, promoRank);
        if ((sq >> 4) === startRank) {
          t = sq + forward + forward;
          if (!(t & 0x88) && !b[t]) list.push(mk(sq, t, 0, 0, 0));
        }
      }
      for (j = -1; j <= 1; j += 2) {
        t = sq + forward + j;
        if (t & 0x88) continue;
        p = b[t];
        if (p && (p >= 8 ? 1 : 0) !== side) {
          pushPawnMove(list, sq, t, p, 0, promoRank);
        } else if (t === pos.ep && b[t] === 0) {
          list.push(mk(sq, t, side === 0 ? (PAWN | 8) : PAWN, 4, 0));
        }
      }
    } else if (ty === KNIGHT || ty === KING) {
      var offs = ty === KNIGHT ? KNIGHT_OFF : KING_OFF;
      for (i = 0; i < 8; i++) {
        t = sq + offs[i];
        if (t & 0x88) continue;
        p = b[t];
        if (!p) {
          if (!capturesOnly) list.push(mk(sq, t, 0, 0, 0));
        } else if ((p >= 8 ? 1 : 0) !== side) {
          list.push(mk(sq, t, p, 0, 0));
        }
      }
    } else {
      var dirs = ty === BISHOP ? BISHOP_OFF : (ty === ROOK ? ROOK_OFF : BISHOP_OFF.concat(ROOK_OFF));
      for (i = 0; i < dirs.length; i++) {
        d = dirs[i];
        s = sq + d;
        while (!(s & 0x88)) {
          p = b[s];
          if (!p) {
            if (!capturesOnly) list.push(mk(sq, s, 0, 0, 0));
          } else {
            if ((p >= 8 ? 1 : 0) !== side) list.push(mk(sq, s, p, 0, 0));
            break;
          }
          s += d;
        }
      }
    }
  }

  if (!capturesOnly) genCastles(pos, list);
  return list;
}

function genCastles(pos, list) {
  var b = pos.board, side = pos.side;
  if (side === 0) {
    if ((pos.castling & 3) && b[4] === KING) {
      if ((pos.castling & 1) && b[7] === ROOK && !b[5] && !b[6] &&
          !isAttacked(pos, 4, 1) && !isAttacked(pos, 5, 1) && !isAttacked(pos, 6, 1)) {
        list.push(mk(4, 6, 0, 1, 0));
      }
      if ((pos.castling & 2) && b[0] === ROOK && !b[1] && !b[2] && !b[3] &&
          !isAttacked(pos, 4, 1) && !isAttacked(pos, 3, 1) && !isAttacked(pos, 2, 1)) {
        list.push(mk(4, 2, 0, 2, 0));
      }
    }
  } else {
    if ((pos.castling & 12) && b[116] === (KING | 8)) {
      if ((pos.castling & 4) && b[119] === (ROOK | 8) && !b[117] && !b[118] &&
          !isAttacked(pos, 116, 0) && !isAttacked(pos, 117, 0) && !isAttacked(pos, 118, 0)) {
        list.push(mk(116, 118, 0, 1, 0));
      }
      if ((pos.castling & 8) && b[112] === (ROOK | 8) && !b[113] && !b[114] && !b[115] &&
          !isAttacked(pos, 116, 0) && !isAttacked(pos, 115, 0) && !isAttacked(pos, 114, 0)) {
        list.push(mk(116, 114, 0, 2, 0));
      }
    }
  }
}

/* ---------- 走子 / 悔子 ---------- */
function makeMove(pos, m) {
  var b = pos.board, moved = b[m.f], cap = b[m.t];
  var u = {
    m: m, moved: moved, cap: cap, capSq: m.t,
    castling: pos.castling, ep: pos.ep, half: pos.half, full: pos.full,
    side: pos.side, kw: pos.king[0], kb: pos.king[1]
  };
  if (m.flag & 4) {
    var cs = pos.side === 0 ? m.t - 16 : m.t + 16;
    u.cap = b[cs]; u.capSq = cs; cap = b[cs];
    b[cs] = 0;
  }
  b[m.t] = moved; b[m.f] = 0;
  if (m.p) b[m.t] = m.p | (pos.side === 0 ? 0 : 8);

  if (m.flag & 1) {
    if (pos.side === 0) { b[5] = b[7]; b[7] = 0; }
    else { b[117] = b[119]; b[119] = 0; }
  } else if (m.flag & 2) {
    if (pos.side === 0) { b[3] = b[0]; b[0] = 0; }
    else { b[115] = b[112]; b[112] = 0; }
  }

  if (typeOf(moved) === KING) pos.king[pos.side] = m.t;

  var cr = pos.castling;
  if (m.f === 4 && typeOf(moved) === KING) cr &= ~3;
  if (m.f === 116 && typeOf(moved) === KING) cr &= ~12;
  if (m.f === 7 || m.t === 7) cr &= ~1;
  if (m.f === 0 || m.t === 0) cr &= ~2;
  if (m.f === 119 || m.t === 119) cr &= ~4;
  if (m.f === 112 || m.t === 112) cr &= ~8;
  pos.castling = cr;

  if (typeOf(moved) === PAWN && (m.t - m.f === 32 || m.t - m.f === -32)) pos.ep = (m.t + m.f) / 2;
  else pos.ep = -1;

  if (typeOf(moved) === PAWN || cap) pos.half = 0; else pos.half++;
  pos.side = 1 - pos.side;
  if (pos.side === 0) pos.full++;
  return u;
}

function undoMove(pos, u) {
  var b = pos.board, m = u.m;
  b[m.f] = u.moved;
  b[m.t] = (m.flag & 4) ? 0 : u.cap;
  if (m.flag & 4) b[u.capSq] = u.cap;
  if (m.flag & 1) {
    if (u.side === 0) { b[7] = b[5]; b[5] = 0; }
    else { b[119] = b[117]; b[117] = 0; }
  } else if (m.flag & 2) {
    if (u.side === 0) { b[0] = b[3]; b[3] = 0; }
    else { b[112] = b[115]; b[115] = 0; }
  }
  pos.castling = u.castling; pos.ep = u.ep; pos.half = u.half; pos.full = u.full;
  pos.king[0] = u.kw; pos.king[1] = u.kb;
  pos.side = u.side;
}

function isLegal(pos, m) {
  var u = makeMove(pos, m);
  var ok = !inCheck(pos, u.side);
  undoMove(pos, u);
  return ok;
}

function legalMoves(pos) {
  var raw = genMoves(pos, false), out = [], i, u;
  for (i = 0; i < raw.length; i++) {
    u = makeMove(pos, raw[i]);
    if (!inCheck(pos, u.side)) out.push(raw[i]);
    undoMove(pos, u);
  }
  return out;
}

/* ---------- SAN ---------- */
function moveToSan(pos, m, legal) {
  if (m.flag & 1) return "O-O" + sanSuffix(pos, m);
  if (m.flag & 2) return "O-O-O" + sanSuffix(pos, m);
  var b = pos.board, p = b[m.f], ty = typeOf(p);
  var s = '';
  if (ty === PAWN) {
    if (m.cap) s += String.fromCharCode(97 + (m.f & 7)) + 'x';
    s += nameOfSq(m.t);
    if (m.p) s += '=' + fenChar(m.p);
  } else {
    s += fenChar(p);
    var amb = [], i;
    for (i = 0; i < legal.length; i++) {
      if (legal[i].t === m.t && legal[i].f !== m.f) {
        var q = b[legal[i].f];
        if (q && typeOf(q) === ty && (isBlackPiece(q) ? 1 : 0) === (isBlackPiece(p) ? 1 : 0)) amb.push(legal[i]);
      }
    }
    if (amb.length) {
      var sameFile = false, sameRank = false, k;
      for (k = 0; k < amb.length; k++) {
        if ((amb[k].f & 7) === (m.f & 7)) sameFile = true;
        if ((amb[k].f >> 4) === (m.f >> 4)) sameRank = true;
      }
      if (!sameFile) s += String.fromCharCode(97 + (m.f & 7));
      else if (!sameRank) s += String.fromCharCode(49 + (m.f >> 4));
      else s += nameOfSq(m.f);
    }
    if (m.cap) s += 'x';
    s += nameOfSq(m.t);
    if (m.p) s += '=' + fenChar(m.p);
  }
  return s + sanSuffix(pos, m);
}

function sanSuffix(pos, m) {
  var u = makeMove(pos, m);
  var chk = inCheck(pos, pos.side);
  var mat = false;
  if (chk) { mat = legalMoves(pos).length === 0; }
  undoMove(pos, u);
  if (mat) return '#';
  if (chk) return '+';
  return '';
}

function moveText(pos, m) {
  var legal = legalMoves(pos);
  return moveToSan(pos, m, legal);
}

];

var PST = [];     /* PST[pieceCode][sq] */
var PSTK_END = []; /* 王 残局 */
(function buildPst() {
  var tables = [null, PST_PAWN, PST_KNIGHT, PST_BISHOP, PST_ROOK, PST_QUEEN, PST_KING_MID];
  var t, p, c, sq, r, f, idx, val;
  for (p = 0; p < 15; p++) { PST[p] = new Array(128); PSTK_END[p] = new Array(128); }
  for (t = 1; t <= 6; t++) {
    for (c = 0; c < 2; c++) {
      p = c === 0 ? t : t | 8;
      for (sq = 0; sq < 128; sq++) {
        PST[p][sq] = 0; PSTK_END[p][sq] = 0;
        if (sq & 0x88) continue;
        r = sq >> 4; f = sq & 7;
        idx = c === 0 ? (7 - r) * 8 + f : r * 8 + f;
        val = tables[t][idx];
        if (c === 1) val = -val;
        PST[p][sq] = val;
        if (t === 6) {
          val = PST_KING_END[idx];
          if (c === 1) val = -val;
          PSTK_END[p][sq] = val;
        }
      }
    }
  }
})();

function evaluateWhite(pos) {
  var b = pos.board, i, p, ty, c, sc = 0, phase = 0;
  var wp = [0,0,0,0,0,0,0,0], bp = [0,0,0,0,0,0,0,0];
  var wb = 0, bb = 0, rookW = 0, rookB = 0;
  for (i = 0; i < 128; i++) {
    if (i & 0x88) continue;
    p = b[i];
    if (!p) continue;
    ty = p & 7; c = p >= 8 ? 1 : 0;
    sc += PST[p][i] + (c === 0 ? MAT[ty] : -MAT[ty]);
    if (ty === PAWN) { if (c === 0) wp[i & 7]++; else bp[i & 7]++; }
    else if (ty === BISHOP) { if (c === 0) wb++; else bb++; }
    else if (ty === ROOK) { if (c === 0) rookW++; else rookB++; }
    else if (ty !== KING) { phase += MAT[ty]; }
  }
  if (phase < 1400) {
    for (i = 0; i < 128; i++) {
      if (i & 0x88) continue;
      p = b[i];
      if (p && (p & 7) === KING) sc += (PSTK_END[p][i] - PST[p][i]);
    }
  }
  /* 兵结构 */
  var f2;
  for (f2 = 0; f2 < 8; f2++) {
    if (wp[f2] > 1) sc -= 8 * (wp[f2] - 1);
    if (bp[f2] > 1) sc += 8 * (bp[f2] - 1);
    if (wp[f2] && !(f2 > 0 && wp[f2-1]) && !(f2 < 7 && wp[f2+1])) sc -= 9;
    if (bp[f2] && !(f2 > 0 && bp[f2-1]) && !(f2 < 7 && bp[f2+1])) sc += 9;
  }
  if (wb >= 2) sc += 18;
  if (bb >= 2) sc -= 18;
  return sc;
}

function evalSide(pos) {
  var s = evaluateWhite(pos);
  return pos.side === 0 ? s : -s;
}

function nowMs() { return new Date().getTime(); }

function orderMoves(moves, b) {
  var i, m, s, arr = [];
  for (i = 0; i < moves.length; i++) {
    m = moves[i];
    s = 0;
    if (m.cap) s = 1000 + MAT[typeOf(m.cap)] * 10 - MAT[typeOf(b[m.f])];
    if (m.p) s += 800;
    arr.push({ m: m, s: s });
  }
  arr.sort(function (a, c) { return c.s - a.s; });
  var out = [];
  for (i = 0; i < arr.length; i++) out.push(arr[i].m);
  return out;
}

function qsearch(pos, alpha, beta, ply, ctx) {
  if ((ctx.nodes++ & 255) === 0 && nowMs() > ctx.deadline) { ctx.aborted = true; return 0; }
  var stand = evalSide(pos);
  if (stand >= beta) return beta;
  if (stand > alpha) alpha = stand;
  if (ply >= 4) return alpha;
  var caps = orderMoves(genMoves(pos, true), pos.board);
  var i, m, u, score;
  for (i = 0; i < caps.length; i++) {
    m = caps[i];
    u = makeMove(pos, m);
    if (inCheck(pos, u.side)) { undoMove(pos, u); continue; }
    score = -qsearch(pos, -beta, -alpha, ply + 1, ctx);
    undoMove(pos, u);
    if (ctx.aborted) return 0;
    if (score >= beta) return beta;
    if (score > alpha) alpha = score;
  }
  return alpha;
}

function negamax(pos, depth, alpha, beta, ply, ctx) {
  if ((ctx.nodes++ & 255) === 0 && nowMs() > ctx.deadline) { ctx.aborted = true; return 0; }
  if (depth <= 0) return qsearch(pos, alpha, beta, 0, ctx);

  var moves = orderMoves(genMoves(pos, false), pos.board);
  var legalCount = 0, best = -INF, i, m, u, score;
  for (i = 0; i < moves.length; i++) {
    m = moves[i];
    u = makeMove(pos, m);
    if (inCheck(pos, u.side)) { undoMove(pos, u); continue; }
    legalCount++;
    score = -negamax(pos, depth - 1, -beta, -alpha, ply + 1, ctx);
    undoMove(pos, u);
    if (ctx.aborted) return 0;
    if (score > best) best = score;
    if (score > alpha) alpha = score;
    if (alpha >= beta) break;
  }
  if (legalCount === 0) {
    return inCheck(pos, pos.side) ? -MATE + ply : 0;
  }
  return best;
}

/* 根节点搜索：逐深度迭代，返回每个根的分数，便于显示候选着法 */
function searchPosition(pos, maxDepth, budgetMs) {
  var ctx = { start: nowMs(), deadline: nowMs() + budgetMs, nodes: 0, aborted: false };
  var rootMoves = legalMoves(pos);
  if (!rootMoves.length) return { best: null, results: [], depth: 0, nodes: 0, time: 0, mate: false };
  var bestList = null, completed = 0, d, i, m, u, score, results;
  for (d = 1; d <= maxDepth; d++) {
    results = [];
    for (i = 0; i < rootMoves.length; i++) {
      m = rootMoves[i];
      u = makeMove(pos, m);
      score = -negamax(pos, d - 1, -INF, INF, 1, ctx);
      undoMove(pos, u);
      if (ctx.aborted) break;
      results.push({ move: m, score: score });
    }
    if (ctx.aborted) {
      if (!bestList && results.length) {
        results.sort(function (a, b) { return b.score - a.score; });
        bestList = results;
      }
      break;
    }
    results.sort(function (a, b) { return b.score - a.score; });
    bestList = results;
    completed = d;
    if (results[0].score > MATE - 200) break;
    if (nowMs() > ctx.deadline) break;
  }
  if (!bestList) bestList = [];
  return {
    best: bestList.length ? bestList[0] : null,
    results: bestList,
    depth: completed,
    nodes: ctx.nodes,
    time: nowMs() - ctx.start,
    mate: bestList.length ? (bestList[0].score > MATE - 200 || bestList[0].score < -MATE + 200) : false
  };
}

/* 电脑选步：入门带随机，初级取最优 */
function pickComputerMove(pos, level) {
  var raw = legalMoves(pos);
  if (!raw.length) return null;
  if (level <= 0) {
    /* 随机但避免立刻送子：一眼评估 */
    var scored = [], i, u, sc;
    for (i = 0; i < raw.length; i++) {
      u = makeMove(pos, raw[i]);
      sc = -evalSide(pos);
      undoMove(pos, u);
      scored.push({ m: raw[i], s: sc + Math.floor(Math.random() * 30) });
    }
    scored.sort(function (a, b) { return b.s - a.s; });
    var top = scored[0].s;
    var pool = [];
    for (i = 0; i < scored.length && i < 6; i++) if (scored[i].s >= top - 25) pool.push(scored[i].m);
    return pool[Math.floor(Math.random() * pool.length)];
  }
  var depth = level >= 4 ? 4 : (level >= 3 ? 3 : (level >= 2 ? 2 : 1));
  var budget = depth === 4 ? 8000 : (depth === 3 ? 5000 : (depth === 2 ? 3000 : 500));
  var res = searchPosition(pos, depth, budget);
  if (!res.best) return raw[0];
  return res.best.move;
}


/* ---------- Lichess 云 Stockfish（Cloud Eval） ---------- */
var CLOUD = { downUntil: 0, downMs: 10 * 60 * 1000 };
var ANA = { gen: 0, active: false, wasRunning: false };

function cloudDown() { return nowMs() < CLOUD.downUntil; }
function cloudMarkDown() { CLOUD.downUntil = nowMs() + CLOUD.downMs; }

function cloudPieceCount(pos) {
  var i, c = 0;
  for (i = 0; i < 128; i++) {
    if (i & 0x88) continue;
    if (pos.board[i]) c++;
  }
  return c;
}

function cloudCacheKey(pos, multiPv) {
  return 'kcc_' + toFen(pos).replace(/ /g, '_') + '_' + multiPv;
}

function cloudCacheGet(key) {
  try {
    var raw = localStorage.getItem(key);
    if (!raw) return null;
    var o = JSON.parse(raw);
    var ttl = o.nf ? 10 * 60 * 1000 : 24 * 60 * 60 * 1000;
    if (nowMs() - o.t > ttl) { localStorage.removeItem(key); return null; }
    return o;
  } catch (e) { return null; }
}

function cloudCacheSet(key, obj) {
  try { localStorage.setItem(key, JSON.stringify(obj)); } catch (e) {}
}

/* 老浏览器没有 fetch，用 XHR；超时手动 abort */
function httpGetJson(url, timeout, cb) {
  var done = false, xhr = null, timer = null;
  function finish(err, data) {
    if (done) return;
    done = true;
    if (timer) { clearTimeout(timer); timer = null; }
    cb(err, data);
  }
  try {
    xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
  } catch (e) { finish('xhr'); return; }
  timer = setTimeout(function () {
    try { if (xhr) xhr.abort(); } catch (e) {}
    finish('timeout');
  }, timeout);
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) return;
    if (xhr.status === 200) {
      try { finish(null, JSON.parse(xhr.responseText)); }
      catch (e) { finish('json'); }
    } else if (xhr.status === 404) {
      finish('notfound');
    } else if (xhr.status === 0) {
      finish('network');
    } else {
      finish('http' + xhr.status);
    }
  };
  xhr.onerror = function () { finish('network'); };
  try { xhr.send(); } catch (e) { finish('send'); }
}

/* 先残局库（7 子内），再 Cloud Eval；结果缓存 */
function cloudLookup(pos, multiPv, timeout, cb) {
  var key = cloudCacheKey(pos, multiPv);
  var cached = cloudCacheGet(key);
  if (cached) {
    setTimeout(function () {
      if (cached.nf) cb(null, 'notfound');
      else cb(cached.d, null);
    }, 0);
    return;
  }
  if (cloudDown()) {
    setTimeout(function () { cb(null, 'down'); }, 0);
    return;
  }
  var fen = toFen(pos), start = nowMs(), pieces = cloudPieceCount(pos);

  function finish(res, err) {
    if (res) cloudCacheSet(key, { t: nowMs(), d: res });
    else if (err === 'notfound') cloudCacheSet(key, { t: nowMs(), nf: 1 });
    cb(res, err);
  }

  function doCloud() {
    httpGetJson('https://lichess.org/api/cloud-eval?fen=' + encodeURIComponent(fen) +
      '&multiPv=' + multiPv, timeout, function (err, data) {
      if (err === 'notfound') { finish(null, 'notfound'); return; }
      if (err) {
        if (err === 'network' || err === 'timeout' || err === 'send' || err === 'xhr' ||
            (err && err.indexOf('http') === 0)) cloudMarkDown();
        cb(null, err);
        return;
      }
      if (!data || !data.pvs || !data.pvs.length) { finish(null, 'notfound'); return; }
      finish({
        source: 'cloud', pvs: data.pvs, depth: data.depth,
        knodes: data.knodes, time: nowMs() - start
      }, null);
    });
  }

  if (pieces <= 7) {
    httpGetJson('https://tablebase.lichess.ovh/standard?fen=' + encodeURIComponent(fen), timeout,
      function (err, data) {
        if (!err && data && data.moves && data.moves.length) {
          finish({
            source: 'tablebase', category: data.category, moves: data.moves,
            pieces: pieces, time: nowMs() - start
          }, null);
        } else if (err === 'network' || err === 'timeout' || err === 'send' || err === 'xhr') {
          cloudMarkDown();
          cb(null, err);
        } else {
          doCloud();
        }
      });
  } else {
    doCloud();
  }
}

function promoType(ch) {
  if (ch === 'q') return QUEEN;
  if (ch === 'r') return ROOK;
  if (ch === 'b') return BISHOP;
  if (ch === 'n') return KNIGHT;
  return 0;
}

function uciToMove(pos, uci) {
  if (!uci || uci.length < 4) return null;
  var from = sqOfName(uci.substr(0, 2));
  var to = sqOfName(uci.substr(2, 2));
  if (from < 0 || to < 0) return null;
  var promo = uci.length > 4 ? promoType(uci.charAt(4).toLowerCase()) : 0;
  var list = legalMoves(pos), i, m;
  for (i = 0; i < list.length; i++) {
    m = list[i];
    if (m.f === from && m.t === to && (!promo || m.p === promo)) return m;
  }
  return null;
}

function cloudBestMove(res, pos) {
  var i, uci, m, line;
  if (res.source === 'tablebase') {
    for (i = 0; i < res.moves.length; i++) {
      m = uciToMove(pos, res.moves[i].uci);
      if (m) return m;
    }
    return null;
  }
  for (i = 0; i < res.pvs.length; i++) {
    line = res.pvs[i].moves || '';
    uci = line.split(' ')[0];
    m = uciToMove(pos, uci);
    if (m) return m;
  }
  return null;
}

function tbScore(cat) {
  if (cat === 'win') return MATE - 100;
  if (cat === 'loss') return -MATE + 100;
  if (cat === 'draw') return 0;
  if (cat === 'cursed-win' || cat === 'maybe-win') return 80;
  if (cat === 'cursed-loss' || cat === 'maybe-loss') return -80;
  return 0;
}

function tbLabel(cat) {
  if (cat === 'win') return '胜';
  if (cat === 'loss') return '负';
  if (cat === 'draw') return '和';
  if (cat === 'cursed-win') return '胜';
  if (cat === 'maybe-win') return '可能胜';
  if (cat === 'cursed-loss') return '负';
  if (cat === 'maybe-loss') return '可能负';
  return '未知';
}

function tbResult(cat, side) {
  var white = side === 0;
  if (cat === 'win' || cat === 'cursed-win') return white ? '白胜' : '黑胜';
  if (cat === 'loss' || cat === 'cursed-loss') return white ? '黑胜' : '白胜';
  if (cat === 'draw') return '和';
  if (cat === 'maybe-win') return white ? '白优' : '黑优';
  if (cat === 'maybe-loss') return white ? '黑优' : '白优';
  return '—';
}

function cloudPvScore(pv, side) {
  if (pv.mate) {
    var ms = side === 0 ? pv.mate : -pv.mate;
    return ms > 0 ? MATE - 100 : -MATE + 100;
  }
  var cp = pv.cp || 0;
  return side === 0 ? cp : -cp;
}

function cloudScore(res, side) {
  if (res.source === 'tablebase') return tbScore(res.category);
  return cloudPvScore(res.pvs[0], side);
}

function cloudModel(res) {
  if (res.source === 'tablebase') {
    return '分析模型 Lichess Tablebase · ' + res.pieces + ' 子残局库';
  }
  var nodes = res.knodes ? ' · ' + (res.knodes / 1000).toFixed(1) + 'M 节点' : '';
  return '分析模型 Lichess Cloud Eval · Stockfish NNUE · 深度 ' + res.depth + nodes;
}

function cloudCandidates(res, pos, legal) {
  var out = [], i, m, line, uci, cp;
  if (res.source === 'tablebase') {
    for (i = 0; i < res.moves.length && i < 3; i++) {
      m = uciToMove(pos, res.moves[i].uci);
      if (m) {
        var tb = res.moves[i].dtm ? 'DTM ' + res.moves[i].dtm :
          (res.moves[i].dtz ? 'DTZ ' + res.moves[i].dtz : '');
        out.push(moveToSan(pos, m, legal) + (tb ? ' ' + tb : ''));
      }
    }
    return out;
  }
  for (i = 0; i < res.pvs.length && i < 3; i++) {
    line = res.pvs[i].moves || '';
    uci = line.split(' ')[0];
    m = uciToMove(pos, uci);
    if (m) {
      cp = cloudPvScore(res.pvs[i], pos.side);
      out.push(moveToSan(pos, m, legal) + ' ' + fmtEval(cp, pos.side));
    }
  }
  return out;
}

function showCloudAnalysisResult(res, pos) {
  var legal = legalMoves(pos), side = pos.side;
  var best = cloudBestMove(res, pos);
  if (!best) return false;
  var bestSan = moveToSan(pos, best, legal);
  var score = cloudScore(res, side);
  var scoreLabel = res.source === 'tablebase' ? tbResult(res.category, side) : fmtEval(score, side);
  var parts = cloudCandidates(res, pos, legal);
  var stats;
  if (res.source === 'tablebase') {
    stats = '残局库　' + res.pieces + ' 子　' + tbResult(res.category, side) +
      '　' + (res.time / 1000).toFixed(1) + ' 秒';
  } else {
    stats = '白方视角　深度 ' + res.depth +
      (res.knodes ? '　' + (res.knodes / 1000).toFixed(1) + 'M 节点' : '') +
      '　' + (res.time / 1000).toFixed(1) + ' 秒　来源 Lichess Cloud Eval';
  }
  var html = '<div class="panel">' + analysisTitle(cloudModel(res)) +
    '<div class="anRow"><div class="anScore">' + scoreLabel + '</div>' +
    '<div class="anBest">最佳着法 <b>' + bestSan + '</b><br>' +
    '候选：' + parts.join('，') + '</div></div><div class="clr"></div>' +
    winBarHtml(score, side) +
    '<div class="anStats">' + stats + '</div></div>';
  showPanel(html);
  byId('pClose').onclick = closePanel;
  GAME.hint = best;
  renderBoard();
  return true;
}

/* ============================================================
   界面与交互（ES3/ES5，兼容 Kindle 第八代内置浏览器）
   ============================================================ */
var SET = {
  base: 5, inc: 3, clockOn: true, refresh: 1,
  vsComputer: false, compSide: 1, level: 2, depth: 3,
  cloudEngine: true, cloudAnalysis: true,
  flipped: false,
  pendBase: 5, pendInc: 3, pendOn: true
};
var MODE = { human: true, compSide: 1, level: 2, cloud: true };
var CLK = { w: 5 * 60000, b: 5 * 60000, run: false, active: 0, last: 0 };
var GAME = {
  pos: null, startFen: '', hist: [], legal: [], selected: -1,
  last: null, result: null, keys: [], hint: null, pending: null,
  thinking: false, gen: 0
};
var EDIT = { pos: null, brush: PAWN, flipped: false };
var gCells = [], eCells = [];
var STORE_KEY = 'kchess_v1';

function byId(id) { return document.getElementById(id); }
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function clockKey(c) { return c === 0 ? 'w' : 'b'; }
function colorName(c) { return c === 0 ? '白方' : '黑方'; }
var LEVEL_NAMES = ['入门', '初级', '中级', '较强', '强'];
function levelName(l) { return LEVEL_NAMES[l] || '初级'; }
function pieceColor(p) { return p >= 8 ? 1 : 0; }

/* ---------- 棋盘 DOM ---------- */
function createBoard(container, handler) {
  var cells = [], i;
  container.innerHTML = '';
  for (i = 0; i < 64; i++) {
    var row = Math.floor(i / 8), col = i % 8;
    var d = document.createElement('div');
    d.className = 'cell';
    d.style.left = (col * 56) + 'px';
    d.style.top = (row * 56) + 'px';
    var img = document.createElement('img');
    img.style.display = 'none';
    d.appendChild(img);
    var mk = document.createElement('div');
    mk.className = 'mark';
    d.appendChild(mk);
    d.onclick = (function (idx) { return function () { handler(idx); }; })(i);
    container.appendChild(d);
    cells.push({ el: d, img: img, mark: mk, piece: 0 });
  }
  return cells;
}

function paintBoard(cells, pos, flipped, selected, legal, last, hint, checkSq) {
  var selMap = new Array(128), i, j, m;
  for (i = 0; i < 128; i++) selMap[i] = 0;
  if (selected >= 0 && legal) {
    for (j = 0; j < legal.length; j++) {
      m = legal[j];
      if (m.f === selected) selMap[m.t] = m.cap ? 2 : 1;
    }
  }
  for (i = 0; i < 64; i++) {
    var row = Math.floor(i / 8), col = i % 8;
    var rank = flipped ? row : 7 - row;
    var file = flipped ? 7 - col : col;
    var sq = rank * 16 + file;
    var c = cells[i];
    var light = ((rank + file) % 2 === 1);
    c.el.style.backgroundColor = light ? '#ffffff' : '#c9c9c9';

    var p = pos.board[sq];
    if (c.piece !== p) {
      c.piece = p;
      if (p) { c.img.src = PIECE_SRC[p]; c.img.style.display = 'block'; }
      else { c.img.style.display = 'none'; }
    }

    var mk = 'mark';
    if (selected >= 0 && sq === selected) mk += ' mk-sel';
    else if (selMap[sq]) mk += selMap[sq] === 2 ? ' mk-ring' : ' mk-dot';
    else if (checkSq >= 0 && sq === checkSq) mk += ' mk-check';
    else if (hint && (sq === hint.f || sq === hint.t)) mk += ' mk-hint';
    else if (last && (sq === last.f || sq === last.t)) mk += ' mk-last';
    c.mark.className = mk;

  }
}

function renderCoords(flipped, rankId, fileId) {
  var rb = byId(rankId), fb = byId(fileId);
  var key = flipped ? 'f' : 'n';
  if (rb.getAttribute('data-k') !== key) {
    var rh = '', r, rank, fh = '', f, file;
    for (r = 0; r < 8; r++) {
      rank = flipped ? r : 7 - r;
      rh += '<div class="clab" style="top:' + (r * 56) + 'px">' + (rank + 1) + '</div>';
    }
    for (f = 0; f < 8; f++) {
      file = flipped ? 7 - f : f;
      fh += '<div class="flab" style="left:' + (f * 56) + 'px">' +
        String.fromCharCode(97 + file) + '</div>';
    }
    rb.innerHTML = rh;
    fb.innerHTML = fh;
    rb.setAttribute('data-k', key);
  }
}

/* ---------- 计时 ---------- */
function tcLabel() {
  if (!SET.clockOn) return '不限时';
  return SET.base + '+' + SET.inc;
}

function clockText(c) {
  if (!SET.clockOn) return '不限时';
  var ms = CLK[clockKey(c)];
  if (ms < 0) ms = 0;
  var sec = Math.floor(ms / 1000);
  var h = Math.floor(sec / 3600);
  var m = Math.floor(sec / 60) % 60;
  var s = sec % 60;
  if (h > 0) return h + ':' + pad2(m) + ':' + pad2(s);
  return m + ':' + pad2(s);
}

function renderClocks() {
  var topColor = SET.flipped ? 0 : 1;
  var botColor = 1 - topColor;
  var l1 = colorName(topColor), l2 = colorName(botColor);
  if (byId('labelTop').innerHTML !== l1) byId('labelTop').innerHTML = l1;
  if (byId('labelBot').innerHTML !== l2) byId('labelBot').innerHTML = l2;
  var t1 = clockText(topColor), t2 = clockText(botColor);
  if (byId('timeTop').innerHTML !== t1) byId('timeTop').innerHTML = t1;
  if (byId('timeBot').innerHTML !== t2) byId('timeBot').innerHTML = t2;
  setClockActive('clockTop', topColor);
  setClockActive('clockBot', botColor);
}

function setClockActive(id, color) {
  var el = byId(id);
  var cls = (CLK.run && CLK.active === color && !GAME.result) ? 'clock on' : 'clock';
  if (el.className !== cls) el.className = cls;
}

function tick() {
  if (!CLK.run || GAME.result) return;
  var t = nowMs(), d = t - CLK.last;
  var k = clockKey(CLK.active);
  CLK[k] -= d;
  CLK.last = t;
  if (CLK[k] <= 0) {
    CLK[k] = 0;
    finish(1 - CLK.active, '超时');
    renderAll();
    saveState();
    return;
  }
  var sec = Math.floor(CLK[k] / 1000);
  var rf = SET.refresh;
  if (rf > 1 && sec > 0 && sec % rf !== 0) return;
  renderClocks();
}

function afterMoveClock(mover) {
  if (!SET.clockOn) return;
  if (CLK.run) {
    var k = clockKey(CLK.active);
    var d = nowMs() - CLK.last;
    CLK[k] -= d;
    if (CLK[k] < 0) CLK[k] = 0;
  }
  CLK[clockKey(mover)] += SET.inc * 1000;
  CLK.run = true;
  CLK.active = 1 - mover;
  CLK.last = nowMs();
}

function tickOnce() {
  if (!CLK.run) return;
  var d = nowMs() - CLK.last;
  var k = clockKey(CLK.active);
  CLK[k] -= d;
  if (CLK[k] < 0) CLK[k] = 0;
  CLK.last = nowMs();
}

function togglePause() {
  if (GAME.result || !SET.clockOn) return;
  if (CLK.run) { tickOnce(); CLK.run = false; }
  else { CLK.run = true; CLK.last = nowMs(); }
  renderClocks();
  renderStatus();
  saveState();
}

/* ---------- 对局流程 ---------- */
function posKey(pos) {
  var f = toFen(pos).split(' ');
  return f[0] + ' ' + f[1] + ' ' + f[2] + ' ' + f[3];
}

function resetGame(pos, base, inc, on, quiet) {
  GAME.gen++;
  SET.base = base; SET.inc = inc; SET.clockOn = on;
  SET.pendBase = base; SET.pendInc = inc; SET.pendOn = on;
  GAME.pos = pos;
  GAME.startFen = toFen(pos);
  GAME.hist = [];
  GAME.legal = legalMoves(pos);
  GAME.selected = -1;
  GAME.last = null;
  GAME.result = null;
  GAME.hint = null;
  GAME.pending = null;
  GAME.thinking = false;
  GAME.keys = [posKey(pos)];
  CLK.w = base * 60000;
  CLK.b = base * 60000;
  CLK.run = false;
  CLK.active = pos.side;
  CLK.last = nowMs();
  if (!quiet) {
    hidePanel();
    renderAll();
    fitScreen();
    saveState();
    scheduleComputer();
  }
}

function finish(winner, reason) {
  GAME.result = { title: colorName(winner) + '胜', sub: reason };
  CLK.run = false;
}

function insufficientMaterial(pos) {
  var b = pos.board, i, p, t, c;
  var kn = [0, 0], bi = [0, 0], other = false;
  for (i = 0; i < 128; i++) {
    if (i & 0x88) continue;
    p = b[i];
    if (!p) continue;
    t = p & 7; c = p >= 8 ? 1 : 0;
    if (t === PAWN || t === ROOK || t === QUEEN) { other = true; break; }
    if (t === KNIGHT) kn[c]++;
    if (t === BISHOP) bi[c]++;
  }
  if (other) return false;
  var total = kn[0] + kn[1] + bi[0] + bi[1];
  if (total <= 1) return true;
  if (total === 2 && (kn[0] === 1 || kn[1] === 1)) return false;
  return false;
}

function checkEnd() {
  var pos = GAME.pos;
  if (!GAME.legal.length) {
    if (inCheck(pos, pos.side)) finish(1 - pos.side, '将杀');
    else GAME.result = { title: '和棋', sub: '逼和' };
    CLK.run = false;
    return;
  }
  if (pos.half >= 100) {
    GAME.result = { title: '和棋', sub: '五十回合' };
    CLK.run = false;
    return;
  }
  if (insufficientMaterial(pos)) {
    GAME.result = { title: '和棋', sub: '子力不足' };
    CLK.run = false;
    return;
  }
  var key = GAME.keys[GAME.keys.length - 1], same = 0, i;
  for (i = 0; i < GAME.keys.length; i++) if (GAME.keys[i] === key) same++;
  if (same >= 3) {
    GAME.result = { title: '和棋', sub: '三次重复' };
    CLK.run = false;
  }
}

function movesTo(f, t) {
  var out = [], i;
  for (i = 0; i < GAME.legal.length; i++) {
    if (GAME.legal[i].f === f && GAME.legal[i].t === t) out.push(GAME.legal[i]);
  }
  return out;
}

function selectSquare(sq) {
  GAME.selected = sq;
  GAME.hint = null;
  hidePanel();
  renderBoard();
}

function clearSelection() {
  if (GAME.selected < 0) return;
  GAME.selected = -1;
  renderBoard();
}

function handleSquare(sq) {
  var pos = GAME.pos, p = pos.board[sq];
  if (GAME.selected < 0) {
    if (p && pieceColor(p) === pos.side) selectSquare(sq);
    return;
  }
  if (sq === GAME.selected) { GAME.selected = -1; renderBoard(); return; }
  var cands = movesTo(GAME.selected, sq);
  if (cands.length) {
    if (cands[0].p) {
      GAME.pending = { f: GAME.selected, t: sq };
      showPromotion();
      return;
    }
    doMove(cands[0]);
    return;
  }
  if (p && pieceColor(p) === pos.side) selectSquare(sq);
  else { GAME.selected = -1; renderBoard(); }
}

function doMove(m) {
  var pos = GAME.pos;
  var san = moveToSan(pos, m, GAME.legal);
  var snap = { w: CLK.w, b: CLK.b, run: CLK.run, active: CLK.active, last: CLK.last };
  var mover = pos.side;
  var u = makeMove(pos, m);
  GAME.hist.push({ m: m, san: san, u: u, snap: snap, color: mover });
  GAME.keys.push(posKey(pos));
  GAME.last = { f: m.f, t: m.t };
  GAME.selected = -1;
  GAME.pending = null;
  GAME.hint = null;
  GAME.legal = legalMoves(pos);
  afterMoveClock(mover);
  checkEnd();
  hidePanel();
  renderAll();
  saveState();
  scheduleComputer();
}

function undoOne() {
  var e = GAME.hist.pop();
  undoMove(GAME.pos, e.u);
  GAME.keys.pop();
  return e;
}

function undoGame() {
  if (!GAME.hist.length || GAME.thinking) return;
  var e = undoOne(), snap = e.snap;
  if (SET.vsComputer && e.color === SET.compSide && GAME.hist.length) {
    e = undoOne();
    snap = e.snap;
  }
  CLK.w = snap.w; CLK.b = snap.b;
  CLK.run = false;
  CLK.active = GAME.pos.side;
  CLK.last = nowMs();
  GAME.result = null;
  GAME.selected = -1;
  GAME.hint = null;
  GAME.pending = null;
  GAME.legal = legalMoves(GAME.pos);
  var last = GAME.hist[GAME.hist.length - 1];
  GAME.last = last ? { f: last.m.f, t: last.m.t } : null;
  hidePanel();
  renderAll();
  saveState();
}

function scheduleComputer() {
  if (!SET.vsComputer || GAME.result) return;
  if (GAME.pos.side !== SET.compSide) return;
  var gen = GAME.gen;
  GAME.thinking = true;
  renderStatus();
  updateButtons();
  setTimeout(function () {
    if (gen !== GAME.gen || GAME.result || GAME.pos.side !== SET.compSide) {
      GAME.thinking = false;
      renderStatus();
      updateButtons();
      return;
    }
    if (SET.cloudEngine && !cloudDown()) {
      /* 云 Stockfish 只取当前局面的云端最佳着法；未收录/断网回退本地档位 */
      cloudLookup(clonePosition(GAME.pos), 1, 5000, function (res, err) {
        if (gen !== GAME.gen || GAME.result || GAME.pos.side !== SET.compSide) {
          GAME.thinking = false;
          renderStatus();
          updateButtons();
          return;
        }
        var mv = res ? cloudBestMove(res, GAME.pos) : null;
        if (!mv) mv = pickComputerMove(GAME.pos, SET.level);
        GAME.thinking = false;
        if (mv) doMove(mv);
        else { renderStatus(); updateButtons(); }
      });
    } else {
      var mv = pickComputerMove(GAME.pos, SET.level);
      GAME.thinking = false;
      if (mv) doMove(mv);
      else { renderStatus(); updateButtons(); }
    }
  }, 250);
}

function startFresh() {
  if (SET.vsComputer) SET.flipped = (SET.compSide === 0);
  resetGame(newPosition(), SET.pendBase, SET.pendInc, SET.pendOn, false);
}

/* ---------- 分析 ---------- */
function analysisTitle(model) {
  return '<div class="ptitle anTitle">' +
    '<span class="ptMain">局面分析</span>' +
    '<span class="ptSub">' + (model ||
      '分析模型 内置 KindleChess Engine v1 · Negamax + Alpha-Beta（非神经网络）· 深度 2–4') +
    '</span><button class="pclose" id="pClose">关闭</button></div>';
}

function whiteWinPct(cp, sideToMove) {
  var v = sideToMove === 0 ? cp : -cp;
  if (v > MATE - 300) return 100;
  if (v < -MATE + 300) return 0;
  var p = 100 / (1 + Math.pow(10, -v / 400));
  if (p < 1) p = 1;
  if (p > 99) p = 99;
  return Math.round(p);
}

function winBarHtml(cp, sideToMove) {
  var w = whiteWinPct(cp, sideToMove);
  var b = 100 - w;
  return '<div class="wrBox"><div class="wrLabels"><span>白方胜率 ' + w +
    '%</span><span class="wrR">黑方 ' + b + '%</span></div>' +
    '<div class="wrBar"><div class="wrFill" style="width:' + b + '%"></div></div></div>';
}

function fmtEval(cp, sideToMove) {
  var v = sideToMove === 0 ? cp : -cp;
  if (v > MATE - 300) return '#';
  if (v < -MATE + 300) return '-#';
  var p = v / 100;
  return (p > 0 ? '+' : '') + p.toFixed(2);
}

function finishAnalysis(wasRunning) {
  if (wasRunning && !GAME.result) { CLK.run = true; CLK.last = nowMs(); }
  renderClocks();
  renderStatus();
  saveState();
}

function runAnalysis() {
  if (GAME.thinking || GAME.pending) return;
  GAME.selected = -1;
  GAME.hint = null;
  renderBoard();

  var wasRunning = CLK.run;
  if (wasRunning) { tickOnce(); CLK.run = false; renderClocks(); renderStatus(); }
  var pos = clonePosition(GAME.pos);
  var useCloud = SET.cloudAnalysis && !cloudDown();
  var gen = ++ANA.gen;
  ANA.active = true;
  ANA.wasRunning = wasRunning;

  var html = '<div class="panel">' + analysisTitle(useCloud ?
      '分析模型 Lichess 云 Stockfish（查询中）' : undefined) +
    '<div class="ptext">' + (useCloud ?
      '正在查询 Lichess 云端（最多 6 秒）。<br>未收录或网络不可用时，自动回退本地引擎。' :
      '正在搜索，深度 ' + SET.depth + '。<br>Kindle 运算较慢，可能需要几秒，期间页面不响应。') +
    '</div></div>';
  showPanel(html);
  byId('pClose').onclick = closePanel;

  setTimeout(function () {
    if (gen !== ANA.gen) return;
    if (useCloud) {
      cloudLookup(pos, 3, 6000, function (res, err) {
        if (gen !== ANA.gen) return;
        ANA.active = false;
        if (res && showCloudAnalysisResult(res, pos)) {
          finishAnalysis(wasRunning);
          return;
        }
        var local = searchPosition(pos, SET.depth, 9000);
        var note = err === 'notfound' ? 'Lichess 云端未收录，已用本地引擎' :
          (err ? 'Lichess 云端不可用，已用本地引擎' : '云端结果无合法着法，已用本地引擎');
        showAnalysisResult(local, pos, undefined, note);
        finishAnalysis(wasRunning);
      });
    } else {
      var res = searchPosition(pos, SET.depth, 9000);
      ANA.active = false;
      showAnalysisResult(res, pos);
      finishAnalysis(wasRunning);
    }
  }, 80);
}

function showAnalysisResult(res, pos, model, note) {
  if (!res.best) {
    var mated = inCheck(pos, pos.side);
    showPanel('<div class="panel">' + analysisTitle(model) +
      '<div class="ptext">当前局面没有合法着法：' + (mated ? '将杀' : '逼和') + '。</div>' +
      winBarHtml(mated ? -MATE : 0, pos.side) + '</div>');
    byId('pClose').onclick = closePanel;
    return;
  }
  var legal = legalMoves(pos);
  var side = pos.side;
  var bestSan = moveToSan(pos, res.best.move, legal);
  var parts = [], i;
  for (i = 0; i < res.results.length && i < 3; i++) {
    parts.push(moveToSan(pos, res.results[i].move, legal) + ' ' + fmtEval(res.results[i].score, side));
  }
  var score = fmtEval(res.best.score, side);
  var stats = '白方视角　深度 ' + res.depth +
    '　' + res.nodes + ' 节点　' + (res.time / 1000).toFixed(1) + ' 秒　胜率按评分换算' +
    (note ? '　' + note : '');
  var html = '<div class="panel">' + analysisTitle(model) +
    '<div class="anRow"><div class="anScore">' + score + '</div>' +
    '<div class="anBest">最佳着法 <b>' + bestSan + '</b><br>' +
    '候选：' + parts.join('，') + '</div></div><div class="clr"></div>' +
    winBarHtml(res.best.score, side) +
    '<div class="anStats">' + stats + '</div></div>';
  showPanel(html);
  byId('pClose').onclick = closePanel;
  GAME.hint = res.best.move;
  renderBoard();
}

/* ---------- 棋盘编辑器 ---------- */
var PAL_ORDER = [KING, QUEEN, ROOK, BISHOP, KNIGHT, PAWN,
                 KING | 8, QUEEN | 8, ROOK | 8, BISHOP | 8, KNIGHT | 8, PAWN | 8];

function openEditor() {
  EDIT.pos = clonePosition(GAME.pos);
  EDIT.brush = PAWN;
  EDIT.flipped = SET.flipped;
  showView('editor');
  buildPalette();
  renderEditor();

function buildPalette() {
  var html = '', i;
  for (i = 0; i < PAL_ORDER.length; i++) {
    var p = PAL_ORDER[i];
    html += '<button class="pal' + (EDIT.brush === p ? ' sel' : '') + '" id="pal' + p + '">' +
      '<img src="' + PIECE_SRC[p] + '"></button>';
  }
  html += '<button class="pal erase' + (EDIT.brush === 0 ? ' sel' : '') + '" id="pal0">擦</button>';
  byId('palette').innerHTML = html;
  for (i = 0; i < PAL_ORDER.length; i++) bindPalette(PAL_ORDER[i]);
  byId('pal0').onclick = function () { EDIT.brush = 0; buildPalette(); };
}

function bindPalette(p) {
  byId('pal' + p).onclick = function () { EDIT.brush = p; buildPalette(); };
}

function editClick(idx) {
  var row = Math.floor(idx / 8), col = idx % 8;
  var rank = EDIT.flipped ? row : 7 - row;
  var file = EDIT.flipped ? 7 - col : col;
  var sq = rank * 16 + file;
  var p = EDIT.brush, i;
  if (p === 0) {
    EDIT.pos.board[sq] = 0;
  } else {
    if ((p & 7) === KING) {
      for (i = 0; i < 128; i++) {
        if (!(i & 0x88) && EDIT.pos.board[i] === p) EDIT.pos.board[i] = 0;
      }
    }
    EDIT.pos.board[sq] = p;
  }
  refreshKings(EDIT.pos);
  fixCastling(EDIT.pos);
  renderEditor();
}

function refreshKings(pos) {
  pos.king = [-1, -1];
  var i, p;
  for (i = 0; i < 128; i++) {
    if (i & 0x88) continue;
    p = pos.board[i];
    if (p === KING) pos.king[0] = i;
    else if (p === (KING | 8)) pos.king[1] = i;
  }
}

function renderEditor() {
  renderCoords(EDIT.flipped, 'erankLabels', 'efileLabels');
  paintBoard(eCells, EDIT.pos, EDIT.flipped, -1, [], null, null, -1);
  byId('fenInput').value = toFen(EDIT.pos);
  syncEditControls();
}

function syncEditControls() {
  setToggle('edSideW', EDIT.pos.side === 0);
  setToggle('edSideB', EDIT.pos.side === 1);
  setToggle('edCW', (EDIT.pos.castling & 1) !== 0);
  setToggle('edCQ', (EDIT.pos.castling & 2) !== 0);
  setToggle('edCk', (EDIT.pos.castling & 4) !== 0);
  setToggle('edCq', (EDIT.pos.castling & 8) !== 0);
}

function setToggle(id, on) {
  var el = byId(id);
  el.className = on ? 'tbtn on' : 'tbtn';
}

function setEditMsg(s) { byId('edMsg').innerHTML = s; }

function validateEditor(pos) {
  var b = pos.board, i, p, rank;
  if (pos.king[0] < 0 || pos.king[1] < 0) return '双方各需要一个王。';
  for (i = 0; i < 128; i++) {
    if (i & 0x88) continue;
    p = b[i];
    if (!p) continue;
    rank = i >> 4;
    if ((p & 7) === PAWN && (rank === 0 || rank === 7)) return '兵不能放在第一或第八横线。';
  }
  var kw = pos.king[0], kb = pos.king[1];
  if (Math.abs((kw & 7) - (kb & 7)) <= 1 && Math.abs((kw >> 4) - (kb >> 4)) <= 1) {
    return '两个王不能相邻。';
  }
  if (inCheck(pos, 1 - pos.side)) return '不该走棋的一方正被将军，局面不合法。';
  return '';
}

function applyEditor() {
  var msg = validateEditor(EDIT.pos);
  if (msg) { setEditMsg(msg); return; }
  SET.flipped = EDIT.flipped;
  showView('game');
  resetGame(clonePosition(EDIT.pos), SET.pendBase, SET.pendInc, SET.pendOn, false);
}

/* ---------- 设置 ---------- */
var PRESETS = [[1, 0], [3, 0], [3, 2], [5, 0], [5, 3], [10, 0],
               [10, 5], [15, 10], [20, 0], [30, 0], [30, 10], [0, 0]];

function presetLabel(b, inc) {
  return b === 0 ? '不限时' : (b + '+' + inc);
}

function renderSettings() {
  var html = '';
  var i, on;

  html += '<div class="sect"><div class="sectTitle">时间控制（下一局）</div><div>';
  for (i = 0; i < PRESETS.length; i++) {
    var b = PRESETS[i][0], inc = PRESETS[i][1];
    on = (SET.pendBase === b && SET.pendInc === inc && (b > 0 ? SET.pendOn : !SET.pendOn));
    html += '<button class="gbtn' + (on ? ' on' : '') + '" id="pre' + i + '">' +
      presetLabel(b, inc) + '</button>';
  }
  html += '</div><div class="clr"></div>';

  html += '<div class="stepRow" style="height:46px"><div class="stepLabel">基础时间</div>' +
    '<button class="stepBtn" id="bm5">-5</button><button class="stepBtn" id="bm1">-1</button>' +
    '<div class="stepVal" id="pbVal">' + SET.pendBase + '</div>' +
    '<button class="stepBtn" id="bp1">+1</button><button class="stepBtn" id="bp5">+5</button>' +
    '<div class="stepUnit">分钟</div></div><div class="clr"></div>';

  html += '<div class="stepRow" style="height:46px"><div class="stepLabel">每步加时</div>' +
    '<button class="stepBtn" id="im5">-5</button><button class="stepBtn" id="im1">-1</button>' +
    '<div class="stepVal" id="piVal">' + SET.pendInc + '</div>' +
    '<button class="stepBtn" id="ip1">+1</button><button class="stepBtn" id="ip5">+5</button>' +
    '<div class="stepUnit">秒</div></div><div class="clr"></div>';

  html += '<div style="margin-top:6px"><button class="btn w180" id="setApply">按此设置开新局</button></div><div class="clr"></div>';
  html += '<div class="note">开新局会清空当前棋局；赛制不会中途改变。</div></div>';

  html += '<div class="sect"><div class="sectTitle">对弈模式</div>' +
    '<div class="note">线下对弈 / 人机对弈、你执哪一方、电脑棋力，统一在工具栏「模式」页设置；模式设置只影响新局。</div></div>';

  html += '<div class="sect"><div class="sectTitle">显示与计算</div>' +
    segRow('棋钟刷新', [['rf1', '1 秒', SET.refresh === 1], ['rf5', '5 秒', SET.refresh === 5], ['rf10', '10 秒', SET.refresh === 10]]) +
    segRow('本地深度', [['dp2', '2 层 快', SET.depth === 2], ['dp3', '3 层', SET.depth === 3], ['dp4', '4 层 深', SET.depth === 4]]) +
    segRow('云分析', [['ca1', '优先', SET.cloudAnalysis], ['ca0', '仅本地', !SET.cloudAnalysis]]) +
    '<div style="margin-top:6px"><button class="btn w180" id="cloudTest">测试云连接</button></div><div class="clr"></div>' +
    '<div class="note" id="cloudTestMsg">云分析使用 Lichess Cloud Eval；未收录或断网时自动回退本地。</div>' +
    '<div class="note">云分析优先；本地深度仅在云端未收录/断网回退时使用。深度 3–4 更准但明显更慢。</div></div>';

  html += '<div class="sect"><div class="sectTitle">说明</div><div class="helpText">' +
    '点自己的棋子选中，再点目标格落子；升变会弹出选择。不支持拖动。' +
    '<br>棋钟在第一次走子后启动；「加时」可给任一方补时，暂停后按「继续棋钟」恢复。' +
    '<br>编辑器支持摆子、载入 FEN、设置先手和易位，再按「开始对局」进入。' +
    '<br>分析可用 Lichess 云端 Stockfish，未收录时回退本地浅层搜索；结果仅供参考，也会占用棋钟时间。' +
    '<br>核心对局完全离线；云引擎/云分析需要联网，失败会自动回退本地。可放入 Kindle 的 documents 目录，用内置浏览器打开 file:///mnt/us/documents/kindle-chess.html' +
    '<br>棋子图形取自 lichess 的 Cburnett 棋具（CC BY-SA 3.0）。' +
    '</div></div>';

  byId('setBody').innerHTML = html;
  bindSettings();
  fitScreen();
}

function segRow(label, items) {
  var h = '<div class="segRow"><div class="segLabel">' + label + '</div>', i;
  for (i = 0; i < items.length; i++) {
    h += '<button class="segBtn' + (items[i][2] ? ' on' : '') + '" id="' + items[i][0] + '">' +
      items[i][1] + '</button>';
  }
  return h + '</div><div class="clr"></div>';
}

function bindSettings() {
  var i;
  for (i = 0; i < PRESETS.length; i++) {
    (function (b, inc) {
      byId('pre' + i).onclick = function () {
        SET.pendBase = b; SET.pendInc = inc;
        SET.pendOn = b > 0;
        renderSettings();
        saveState();
      };
    })(PRESETS[i][0], PRESETS[i][1]);
  }
  byId('bm5').onclick = function () { stepBase(-5); };
  byId('bm1').onclick = function () { stepBase(-1); };
  byId('bp1').onclick = function () { stepBase(1); };
  byId('bp5').onclick = function () { stepBase(5); };
  byId('im5').onclick = function () { stepInc(-5); };
  byId('im1').onclick = function () { stepInc(-1); };
  byId('ip1').onclick = function () { stepInc(1); };
  byId('ip5').onclick = function () { stepInc(5); };
  byId('setApply').onclick = function () { applyPending(); };

  byId('rf1').onclick = function () { SET.refresh = 1; renderSettings(); saveState(); };
  byId('rf5').onclick = function () { SET.refresh = 5; renderSettings(); saveState(); };
  byId('rf10').onclick = function () { SET.refresh = 10; renderSettings(); saveState(); };
  byId('dp2').onclick = function () { SET.depth = 2; renderSettings(); saveState(); };
  byId('dp3').onclick = function () { SET.depth = 3; renderSettings(); saveState(); };
  byId('dp4').onclick = function () { SET.depth = 4; renderSettings(); saveState(); };
  byId('ca1').onclick = function () { SET.cloudAnalysis = true; renderSettings(); saveState(); };
  byId('ca0').onclick = function () { SET.cloudAnalysis = false; renderSettings(); saveState(); };
  byId('cloudTest').onclick = testCloud;
}

function testCloud() {
  var msg = byId('cloudTestMsg');
  if (!msg) return;
  msg.innerHTML = '正在连接 Lichess 云端…';
  CLOUD.downUntil = 0;
  cloudLookup(newPosition(), 1, 6000, function (res, err) {
    if (res) {
      msg.innerHTML = '云端可用 · ' + (res.source === 'tablebase' ? '残局库' :
        ('深度 ' + res.depth + ' · ' + (res.time / 1000).toFixed(1) + ' 秒')) +
        ' · 人机对战与云分析可用';
    } else {
      msg.innerHTML = '云端暂不可用：' + (err === 'notfound' ? '该局面未收录' :
        (err === 'down' ? '刚失败过，稍后再试' : '网络或服务失败')) + '；已保留本地回退。';
    }
  });
}


/* ---------- 对弈模式页 ---------- */
function openMode() {
  MODE.human = !SET.vsComputer;
  MODE.compSide = SET.compSide;
  MODE.level = SET.level;
  MODE.cloud = SET.cloudEngine;
  showView('mode');
  renderMode();
}

function renderMode() {
  var i;
  byId('modeHuman').className = 'modeCard' + (MODE.human ? ' on' : '');
  byId('modeCpu').className = 'modeCard' + (MODE.human ? '' : ' on');
  byId('modeCpuOpts').style.display = MODE.human ? 'none' : 'block';
  byId('msWhite').className = 'mbtn' + (MODE.compSide === 1 ? ' on' : '');
  byId('msBlack').className = 'mbtn' + (MODE.compSide === 0 ? ' on' : '');
  byId('ce1').className = 'mbtn' + (MODE.cloud ? ' on' : '');
  byId('ce0').className = 'mbtn' + (MODE.cloud ? '' : ' on');
  byId('mlabelLevel').innerHTML = MODE.cloud ? '回退棋力' : '电脑棋力';
  for (i = 0; i < 5; i++) {
    byId('ml' + i).className = 'mbtn' + (MODE.level === i ? ' on' : '');
  }
  byId('modeNote').innerHTML = MODE.human ?
    '两人同屏：双方轮流在同一台设备上走棋。' :
    '人机：你执' + (MODE.compSide === 1 ? '白' : '黑') + '，电脑执' +
    (MODE.compSide === 1 ? '黑' : '白') + '。' +
    (MODE.cloud ?
      '<br>引擎：Lichess 云 Stockfish；未收录或断网时按回退棋力本地走。' :
      '<br>引擎：本地 KindleChess。' + (MODE.level >= 3 ? ' 较强/强档会思考数秒。' : ''));
  byId('modeStart').innerHTML = MODE.human ? '以线下模式开始新局' : '以人机模式开始新局';
  byId('modeMsg').innerHTML = '';
  fitScreen();
}

function applyMode() {
  SET.vsComputer = !MODE.human;
  SET.compSide = MODE.compSide;
  SET.level = MODE.level;
  SET.cloudEngine = MODE.cloud;
  showView('game');
  startFresh();
  saveState();
}

function stepBase(d) {
  SET.pendBase += d;
  if (SET.pendBase < 0) SET.pendBase = 0;
  if (SET.pendBase > 180) SET.pendBase = 180;
  SET.pendOn = SET.pendBase > 0;
  if (SET.pendBase === 0) SET.pendInc = 0;
  renderSettings();
}

function stepInc(d) {
  SET.pendInc += d;
  if (SET.pendInc < 0) SET.pendInc = 0;
  if (SET.pendInc > 60) SET.pendInc = 60;
  if (SET.pendBase > 0) SET.pendOn = true;
  renderSettings();
}

function applyPending() {
  if (SET.pendBase <= 0) { SET.pendBase = 0; SET.pendInc = 0; SET.pendOn = false; }
  showView('game');
  startFresh();
}

/* ---------- 存取 ---------- */
function saveState() {
  try {
    var mv = [], i, m;
    for (i = 0; i < GAME.hist.length; i++) {
      m = GAME.hist[i].m;
      mv.push(nameOfSq(m.f) + nameOfSq(m.t) + (m.p ? fenChar(m.p) : ''));
    }
    var w = Math.max(0, Math.round(CLK.w / 1000));
    var b = Math.max(0, Math.round(CLK.b / 1000));
    var s = GAME.startFen + '|' + mv.join(',') + '|' + w + ',' + b + '|' +
      SET.base + ',' + SET.inc + ',' + (SET.clockOn ? '1' : '0') + ',' +
      (SET.vsComputer ? '1' : '0') + ',' + SET.compSide + ',' + SET.level + ',' +
      SET.refresh + ',' + SET.depth + ',' + (SET.flipped ? '1' : '0') + ',' +
      (SET.cloudEngine ? '1' : '0') + ',' + (SET.cloudAnalysis ? '1' : '0');
    localStorage.setItem(STORE_KEY, s);
  } catch (e) {}
}

function restoreGame(data) {
  try {
  var p = data.split('|');
  if (p.length < 4) return false;
  var pos = parseFen(p[0]);
  if (!pos) return false;
  var setup = p[3].split(',');
  var base = parseInt(setup[0], 10); if (isNaN(base)) base = 5;
  var inc = parseInt(setup[1], 10); if (isNaN(inc)) inc = 3;
  var on = setup[2] !== '0';
  SET.vsComputer = setup[3] === '1';
  SET.compSide = parseInt(setup[4], 10) === 0 ? 0 : 1;
  SET.level = parseInt(setup[5], 10); if (isNaN(SET.level) || SET.level < 0) SET.level = 1;
  if (SET.level > 4) SET.level = 4;
  SET.refresh = parseInt(setup[6], 10) || 1;
  SET.depth = parseInt(setup[7], 10);
  if (isNaN(SET.depth) || SET.depth < 2 || SET.depth > 4) SET.depth = 3;
  SET.flipped = setup[8] === '1';
  SET.cloudEngine = setup[9] !== '0';
  SET.cloudAnalysis = setup[10] !== '0';

  resetGame(pos, base, inc, on, true);

  var toks = p[1] ? p[1].split(',') : [];
  var i, j, tok, from, to, promo, found, mm, san, u;
  for (i = 0; i < toks.length; i++) {
    tok = toks[i];
    if (!tok) continue;
    from = sqOfName(tok.substr(0, 2));
    to = sqOfName(tok.substr(2, 2));
    promo = 0;
    if (tok.length > 4) {
      var ch = tok.charAt(4);
      promo = ch === 'q' || ch === 'Q' ? QUEEN :
              ch === 'r' || ch === 'R' ? ROOK :
              ch === 'b' || ch === 'B' ? BISHOP :
              ch === 'n' || ch === 'N' ? KNIGHT : 0;
    }
    found = null;
    for (j = 0; j < GAME.legal.length; j++) {
      mm = GAME.legal[j];
      if (mm.f === from && mm.t === to) {
        if ((promo && mm.p === promo) || (!promo && !mm.p)) { found = mm; break; }
      }
    }
    if (!found) return false;
    san = moveToSan(GAME.pos, found, GAME.legal);
    var color = GAME.pos.side;
    u = makeMove(GAME.pos, found);
    GAME.hist.push({ m: found, san: san, u: u, snap: { w: CLK.w, b: CLK.b, run: false, active: color, last: 0 }, color: color });
    GAME.keys.push(posKey(GAME.pos));
    GAME.legal = legalMoves(GAME.pos);
  }
  var clkv = p[2].split(',');
  CLK.w = (parseInt(clkv[0], 10) || 0) * 1000;
  CLK.b = (parseInt(clkv[1], 10) || 0) * 1000;
  CLK.run = false;
  if (SET.clockOn) {
    if (CLK.w <= 0 && CLK.b > 0) finish(1, '超时');
    else if (CLK.b <= 0 && CLK.w > 0) finish(0, '超时');
  }
  CLK.active = GAME.pos.side;
  CLK.last = nowMs();
  var lm = GAME.hist[GAME.hist.length - 1];
  GAME.last = lm ? { f: lm.m.f, t: lm.m.t } : null;
  checkEnd();
  return true;
  } catch (e) { return false; }
}

function initGame() {
  var data = null;
  try { data = localStorage.getItem(STORE_KEY); } catch (e) {}
  if (data && restoreGame(data)) {
    renderAll();
    scheduleComputer();
    return;
  }
  resetGame(newPosition(), 5, 3, true, true);
  renderAll();
}

/* ---------- 事件与启动 ---------- */
function gameClick(idx) {
  if (GAME.thinking || GAME.pending || GAME.result) return;
  var row = Math.floor(idx / 8), col = idx % 8;
  var rank = SET.flipped ? row : 7 - row;
  var file = SET.flipped ? 7 - col : col;
  handleSquare(rank * 16 + file);
}

function bindStatic() {
  var i;
  byId('bNew').onclick = function () {
    if (GAME.hist.length || GAME.result) confirmNewGame();
    else startFresh();
  };
  byId('bUndo').onclick = undoGame;
  byId('bFlip').onclick = function () {
    SET.flipped = !SET.flipped;
    renderAll();
    saveState();
  };
  byId('bTime').onclick = function () { if (SET.clockOn) showAddTime(); };
  byId('bEdit').onclick = openEditor;
  byId('bAnalyse').onclick = runAnalysis;
  byId('bSet').onclick = function () { showView('settings'); renderSettings(); };
  byId('bMode').onclick = openMode;
  byId('modeBack').onclick = function () { showView('game'); };
  byId('modeHuman').onclick = function () { MODE.human = true; renderMode(); };
  byId('modeCpu').onclick = function () { MODE.human = false; renderMode(); };
  byId('msWhite').onclick = function () { MODE.compSide = 1; renderMode(); };
  byId('msBlack').onclick = function () { MODE.compSide = 0; renderMode(); };
  byId('ce1').onclick = function () { MODE.cloud = true; renderMode(); };
  byId('ce0').onclick = function () { MODE.cloud = false; renderMode(); };
  for (i = 0; i < 5; i++) {
    (function (n) { byId('ml' + n).onclick = function () { MODE.level = n; renderMode(); }; })(i);
  }
  byId('modeStart').onclick = applyMode;
  byId('btnPause').onclick = togglePause;

  byId('edBack').onclick = function () { showView('game'); };
  byId('edSideW').onclick = function () { EDIT.pos.side = 0; renderEditor(); };
  byId('edSideB').onclick = function () { EDIT.pos.side = 1; renderEditor(); };
  byId('edCW').onclick = function () { toggleCastle(1); };
  byId('edCQ').onclick = function () { toggleCastle(2); };
  byId('edCk').onclick = function () { toggleCastle(4); };
  byId('edCq').onclick = function () { toggleCastle(8); };
  byId('edFenLoad').onclick = function () {
    var p = parseFen(byId('fenInput').value);
    if (!p) { setEditMsg('无法解析该 FEN。'); return; }
    EDIT.pos = p;
    renderEditor();
    setEditMsg('FEN 已载入。');
  };
  byId('edStart').onclick = applyEditor;
  byId('edClear').onclick = function () {
    var i;
    for (i = 0; i < 128; i++) EDIT.pos.board[i] = 0;
    refreshKings(EDIT.pos);
    fixCastling(EDIT.pos);
    renderEditor();
    setEditMsg('棋盘已清空，请摆上双方的王。');
  };
  byId('edInit').onclick = function () {
    EDIT.pos = newPosition();
    renderEditor();
    setEditMsg('已恢复初始局面。');
  };
  byId('setBack').onclick = function () { showView('game'); };
}

function toggleCastle(bit) {
  EDIT.pos.castling = EDIT.pos.castling ^ bit;
  renderEditor();
}

function fitScreen() {
  var app = byId('app');
  if (!app) return;
  /* 先回到 1:1 量当前视图的真实内容，再按视口等比缩放；
     这样模式栏、分析面板、设置页变高时也不会顶出屏幕。 */
  app.style.zoom = 1;
  var sw = Math.max(app.scrollWidth || 0, app.offsetWidth || 0);
  var sh = Math.max(app.scrollHeight || 0, app.offsetHeight || 0);
  var w = window.innerWidth || document.documentElement.clientWidth || 568;
  var h = window.innerHeight || document.documentElement.clientHeight || 660;
  if (screen && screen.width && screen.width < w) w = screen.width;
  if (screen && screen.height && screen.height < h) h = screen.height;
  var sx = (w - 2) / (sw || 568);
  var sy = (h - 2) / (sh || 660);
  var s = sx < sy ? sx : sy;
  if (!(s > 0)) s = 1;
  /* 留 1% 余量，避免老浏览器取整后多出 1px 滚动条 */
  app.style.zoom = s * 0.99;
}

function init() {
  gCells = createBoard(byId('board'), gameClick);
  eCells = createBoard(byId('editBoard'), editClick);
  bindStatic();
  initGame();
  fitScreen();
  setInterval(tick, 250);
}

window.onresize = fitScreen;
window.onorientationchange = fitScreen;
init();


</script>
