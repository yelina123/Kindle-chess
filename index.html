<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kindle 小应用 · yelina123</title>
<style>
html, body { margin: 0; padding: 0; }
body {
  background: #ffffff; color: #000000;
  font-family: Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Heiti SC", sans-serif;
  font-size: 15px; line-height: 1.45;
  -webkit-text-size-adjust: none;
}
#wrap { width: 92%; max-width: 568px; margin: 0 auto; padding: 18px 0 26px 0; }
#hdr { border-bottom: 2px solid #000; padding-bottom: 10px; }
h1 {
  margin: 0; font: normal 30px/36px Georgia, "Songti SC", "Times New Roman", serif;
  letter-spacing: 1px;
}
.sub { font-size: 11px; line-height: 16px; margin-top: 3px; }
.author { font-size: 11px; line-height: 16px; margin-top: 2px; font-weight: bold; }
.intro { font-size: 13px; line-height: 20px; margin: 16px 0 12px 0; }
.project {
  display: block; border: 2px solid #000; background: #fff; color: #000;
  padding: 12px 14px; margin: 12px 0; text-decoration: none;
}
.project:active { background: #000; color: #fff; }
.project .t {
  display: block; font: bold 20px/26px Georgia, "Songti SC", serif;
}
.project .d { display: block; font-size: 12px; line-height: 18px; margin-top: 3px; }
.project .s {
  display: block; font-size: 11px; line-height: 16px;
  border-top: 1px solid #000; margin-top: 8px; padding-top: 5px;
}
.project.soon { border-style: dashed; }
.project.soon .s { border-top-style: dashed; }
.note { font-size: 11px; line-height: 16px; border-top: 1px solid #000; margin-top: 16px; padding-top: 8px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hdr">
    <h1>Kindle 小应用</h1>
    <div class="sub">低算力 · 黑白墨水屏 · 核心离线 · 云可选</div>
    <div class="author">作者 yelina123</div>
  </div>

  <p class="intro">给 Kindle 第八代这类设备做的小工具。每个项目是一个独立 HTML 文件，点开即用；核心对局离线，云引擎/云分析可选。</p>

  <a class="project" href="chess/">
    <span class="t">国际象棋</span>
    <span class="d">完整规则 · 点按走子 · 棋钟与加时 · 棋盘编辑器 · 云/本地局面分析 · 云/本地人机对弈</span>
    <span class="s">打开项目</span>
  </a>

  <div class="project soon">
    <span class="t">中国象棋</span>
    <span class="d">预留的项目位置，稍后加入。</span>
    <span class="s">待加入</span>
  </div>

  <div class="note">旧地址 kindle-chess.html 会自动转到国际象棋。所有项目共用本仓库；各项目在 16:9 横竖屏与 Kindle 比例下均完整显示。</div>
</div>
<script>
(function () {
  var wrap = document.getElementById("wrap");
  function fit() {
    if (!wrap) return;
    wrap.style.zoom = 1;
    var w = window.innerWidth || document.documentElement.clientWidth || 375;
    var h = window.innerHeight || document.documentElement.clientHeight || 667;
    if (screen && screen.width && screen.width < w) w = screen.width;
    if (screen && screen.height && screen.height < h) h = screen.height;
    var sw = Math.max(wrap.scrollWidth || 0, wrap.offsetWidth || 0);
    var sh = Math.max(wrap.scrollHeight || 0, wrap.offsetHeight || 0);
    var s = Math.min((w - 2) / (sw || 375), (h - 2) / (sh || 667));
    if (!(s > 0)) s = 1;
    wrap.style.zoom = s * 0.99;
  }
  window.onresize = fit;
  window.onorientationchange = fit;
  fit();
})();
</script>
</body>
</html>
